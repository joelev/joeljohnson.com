<!doctype html>
<html><head><meta charset="utf-8"><title>Joel Johnson · Narrative Strategy & Execution</title>
<style>
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:block;src:url(fonts/inter-600.woff2) format('woff2')}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
</head><body>
<div id="gl"></div>
<div id="brochure"></div>
<div id="hint">scroll</div>
<div id="dbg"></div>
<div id="sections"></div>
<script type="module">
import * as THREE from 'three';
await document.fonts.load('600 64px Inter'); await document.fonts.ready;
const q=new URLSearchParams(location.search);
const meta=await (await fetch('data/meta.json')).json();
const raw=new Uint16Array(await (await fetch('data/frames.bin')).arrayBuffer());
const W=meta.w,H=meta.h,F=meta.frames,STEP=meta.step,FPS=meta.srcFps/STEP;
const toIdx=o=>Math.min(F-1,Math.round(o/STEP));
const B=meta.bounds, ZR=meta.zrange, cellW=(B[1]-B[0])/W, cellH=(B[3]-B[2])/H;
const STRIDE=+(q.get('s')||3), GS=+(q.get('g')||2.4), AMB=+(q.get('amb')??0.3), ZSHIFT=0.42;
const REST=toIdx(meta.rest), GESTURE=meta.segments[0];
const CAMZ=1.25, FOV=30;
const dbg=document.getElementById('dbg');
const FONTFAM='Inter,"Helvetica Neue",Helvetica,Arial,sans-serif';

// ---------- content ----------
const BRANDS=[{k:'generalmotors'},{k:'ibm'},{k:'twitch'},{k:'ford'},{k:'audi'},{k:'jetzero'},{k:'airstream'},{k:'dashlane'},{k:'roadtrippers'},{text:'Thor Industries'},{k:'stellaartois',file:'logos/stellaartois.png'},{text:'Array Labs'},{text:'Veho'}];
const PUBS=[{k:'wired',note:'cover writer'},{text:'Wirecutter',note:'founding team'},{k:'gizmodo',note:'editor'},{text:'Lifehacker'},{k:'popularmechanics',note:'columnist'},{k:'gq'},{text:'American Photo',note:'cover writer'},{k:'roadandtrack'}];
const SKILLS=['Narrative strategy','Editorial leadership','Executive communications','Corporate vision frameworks','Brand identity direction','Launch & go-to-market','Integrated campaigns','Audience growth & analytics','Crisis & community comms','Documentary & video','AI workflow & systems','AI-search measurement'];
const SCENES=[
 {type:'brochure'},
 {type:'claim', bg:'generalmotors', lines:[{t:'Zero Crashes,',size:0.06},{t:'Zero Emissions,',size:0.06},{t:'Zero Congestion.',size:0.06,gap:0.05}], caption:['General Motors asked me to create their "Zero, Zero, Zero" corporate vision framework,','which has served as primary investor and employee narrative for nearly a decade.']},
 {type:'claim', bg:'ibm', lines:[{t:'2M views',size:0.075},{t:'in 48 hours.',size:0.075,gap:0.05}], caption:['IBM asked me to develop an earned-social campaign','translating mainframe heritage for cloud developers.']},
 {type:'skills', title:'What I do'},
 {type:'editorial', title:'Editorial Leadership & Journalism'},
 {type:'close', line:"Let's find the signal and go make some noise.", caption:'joeljohnson@gmail.com · New York'},
];
const S=SCENES.length;
document.getElementById('sections').innerHTML=SCENES.map(()=>'<div class="sec"></div>').join('');

// ---------- glyph atlas ----------
const G=16,CELL=64;
const POOL='JOELJOHNSONABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789&?!@#%*+-/=<>{}[]();:.,';
let chars=''; const seen=new Set();
const allText=POOL+SCENES.flatMap(s=>[...(s.lines||[]).map(l=>l.t),...(s.caption||[]),s.title||'',s.line||'']).join('')+SKILLS.join('')+BRANDS.concat(PUBS).map(b=>(b.text||'')+(b.note||'')).join('')+'abcdefghijklmnopqrstuvwxyz\'’"·JOEL JOHNSONNarrative Strategy & ExecutionI translate technical and customer truths into narratives that earn trust.Let\'s fall in love with your mission again.';
for(const ch of allText) if(ch!==' '&&!seen.has(ch)){seen.add(ch);chars+=ch;}
chars=chars.slice(0,G*G); const gidx=ch=>{const i=chars.indexOf(ch);return i<0?0:i;}; const NPOOL=POOL.length;
const cv=document.createElement('canvas'); cv.width=cv.height=G*CELL; const ctx=cv.getContext('2d');
ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle='#fff';
ctx.font=`600 ${CELL*0.82}px ${FONTFAM}`; ctx.textAlign='center'; ctx.textBaseline='middle';
for(let i=0;i<chars.length;i++) ctx.fillText(chars[i],(i%G)*CELL+CELL/2,Math.floor(i/G)*CELL+CELL/2+CELL*0.04);
const atlas=new THREE.CanvasTexture(cv); atlas.generateMipmaps=true; atlas.minFilter=THREE.LinearMipmapLinearFilter; atlas.anisotropy=4;
const meas=document.createElement('canvas').getContext('2d');
function advance(ch,size){ meas.font=`600 100px ${FONTFAM}`; return meas.measureText(ch).width/100*size; }
function textWidth(t,size){ let w=0; for(const ch of t) w+=advance(ch,size); return w; }

// ---------- world / camera ----------
let vh=2*Math.tan(THREE.MathUtils.degToRad(FOV/2))*CAMZ, vw=vh*innerWidth/innerHeight;
const TGT=new THREE.Vector3(0,-0.02,0.05);
const camera=new THREE.PerspectiveCamera(FOV,innerWidth/innerHeight,0.05,20);
function restCamera(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); camera.position.set(TGT.x,TGT.y,TGT.z+(CAMZ-TGT.z)); camera.lookAt(TGT); camera.updateMatrixWorld(); }
restCamera();
function screenToZ0(cx,cy){ const nd=new THREE.Vector3(cx/innerWidth*2-1,-(cy/innerHeight*2-1),0.5).unproject(camera); const dir=nd.sub(camera.position).normalize(); const t=-camera.position.z/dir.z; return camera.position.clone().add(dir.multiplyScalar(t)); }
const tscale=()=>THREE.MathUtils.clamp(vw/1.05,0.55,1);

// ---------- logo masks ----------
const masks={};
async function loadMask(key,file){ if(masks[key]) return masks[key];
  const img=new Image(); img.src=file||('logos/'+key+'.svg'); await img.decode().catch(()=>{});
  let iw=img.naturalWidth||300, ih=img.naturalHeight||150; const scale=480/Math.max(iw,ih); const c=document.createElement('canvas'); c.width=Math.ceil(iw*scale); c.height=Math.ceil(ih*scale); const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data; const a=new Uint8Array(c.width*c.height); let minx=c.width,maxx=0,miny=c.height,maxy=0,n=0;
  for(let i=0;i<a.length;i++){ if(d[i*4+3]>100){ a[i]=1; n++; const px=i%c.width, py=Math.floor(i/c.width); if(px<minx)minx=px; if(px>maxx)maxx=px; if(py<miny)miny=py; if(py>maxy)maxy=py; } }
  return masks[key]={a,w:c.width,h:c.height,minx,maxx,miny,maxy,n}; }
function textMask(text,px=140){ const key='text:'+text; if(masks[key]) return masks[key];
  const c=document.createElement('canvas'); const x=c.getContext('2d',{willReadFrequently:true}); x.font=`600 ${px}px ${FONTFAM}`; c.width=Math.ceil(x.measureText(text).width)+20; c.height=Math.ceil(px*1.3); x.font=`600 ${px}px ${FONTFAM}`; x.textBaseline='middle'; x.fillStyle='#fff'; x.fillText(text,10,c.height/2);
  const d=x.getImageData(0,0,c.width,c.height).data; const a=new Uint8Array(c.width*c.height); let minx=c.width,maxx=0,miny=c.height,maxy=0,n=0;
  for(let i=0;i<a.length;i++){ if(d[i*4+3]>100){ a[i]=1; n++; const px2=i%c.width, py=Math.floor(i/c.width); if(px2<minx)minx=px2; if(px2>maxx)maxx=px2; if(py<miny)miny=py; if(py>maxy)maxy=py; } }
  return masks[key]={a,w:c.width,h:c.height,minx,maxx,miny,maxy,n}; }
// sample a mask into glyph items centered at (cx,cy), fitted in boxW x boxH, ~target points
function sampleMask(m,cx,cy,boxW,boxH,opts={}){ const bw=m.maxx-m.minx+1, bh=m.maxy-m.miny+1; const sc=Math.min(boxW/bw,boxH/bh); const target=opts.target||220; const area=m.n; const step=Math.max(2,Math.sqrt(area/target)); const items=[]; const gsz=step*sc*(opts.glyph||1.7);
  for(let py=m.miny;py<=m.maxy;py+=step)for(let px=m.minx;px<=m.maxx;px+=step){ const jx=px+(Math.random()-0.5)*step*0.7, jy=py+(Math.random()-0.5)*step*0.7; const sx=Math.round(Math.min(m.w-1,Math.max(0,jx))), sy=Math.round(Math.min(m.h-1,Math.max(0,jy))); if(m.a[sy*m.w+sx]){ items.push({x:cx+(jx-(m.minx+bw/2))*sc, y:cy-(jy-(m.miny+bh/2))*sc, z:(opts.z||0)+(Math.random()-0.5)*0.01, g:Math.floor(Math.random()*NPOOL), b:(opts.b||0.8)*(0.85+Math.random()*0.3), s:gsz, w:opts.w||0}); } }
  return {items, w:bw*sc, h:bh*sc}; }
function fitBox(m,boxW,boxH){ const bw=m.maxx-m.minx+1, bh=m.maxy-m.miny+1; const sc=Math.min(boxW/bw,boxH/bh); return {w:bw*sc,h:bh*sc}; }
// flow a list of boxes into centered rows; returns centers
function flowRows(sizes,maxW,gapX,gapY,topY){ const rows=[[]]; let rw=0; sizes.forEach((sz,i)=>{ if(rw+sz.w>maxW&&rows[rows.length-1].length){rows.push([]);rw=0;} rows[rows.length-1].push(i); rw+=sz.w+gapX; });
  const out=new Array(sizes.length); let y=topY; for(const row of rows){ const rh=Math.max(...row.map(i=>sizes[i].h)); const tw=row.reduce((a,i)=>a+sizes[i].w,0)+gapX*(row.length-1); let x=-tw/2; for(const i of row){ out[i]={x:x+sizes[i].w/2,y:y-rh/2}; x+=sizes[i].w+gapX; } y-=rh+gapY; }
  return {centers:out,height:topY-y-gapY}; }
function gridRows(sizes,cols,cellW,cellH,gapX,gapY,topY){ const n=sizes.length, rows=Math.ceil(n/cols); const out=[]; for(let i=0;i<n;i++){ const r=Math.floor(i/cols), inRow=Math.min(cols,n-r*cols), c=i%cols; const rowW=inRow*cellW+(inRow-1)*gapX; out.push({x:-rowW/2+c*(cellW+gapX)+cellW/2, y:topY-cellH/2-r*(cellH+gapY)}); } return {centers:out,height:rows*cellH+(rows-1)*gapY}; }
async function maskFor(b){ return b.k?await loadMask(b.k,b.file):textMask(b.text); }

// ---------- head ----------
const st=STRIDE, cw=Math.floor(W/st), chh=Math.floor(H/st);
const used=[REST]; for(let o=GESTURE[0];o<=GESTURE[1];o+=STEP*4) used.push(toIdx(o));
const headCells=[];
for(let j=0;j<chh;j++)for(let i=0;i<cw;i++){ const ix=i*st+Math.floor(st/2), iy=j*st+Math.floor(st/2); let any=false; for(const f of used){ if(raw[f*W*H+iy*W+ix]>0){any=true;break;} } if(any) headCells.push([ix,iy]); }
const Mh=headCells.length;
const L=new THREE.Vector3(-0.55,0.5,0.68).normalize();
function dep(fi,fj,m,ix,iy){ if(ix<0||iy<0||ix>=W||iy>=H) return 0; const a=raw[fi*W*H+iy*W+ix]/65535, b=raw[fj*W*H+iy*W+ix]/65535; if(a>0&&b>0) return a+(b-a)*m; return Math.max(a,b); }

// ---------- text layout ----------
function layoutLines(lines,cx,topY){ const items=[]; let y=topY; for(const l of lines){ const size=l.size; y-=size*1.25*0.5; let x=cx-textWidth(l.t,size)/2; for(const ch of l.t){ const a=advance(ch,size); if(ch!==' ') items.push({x:x+a/2,y,z:0,g:gidx(ch),b:l.bright??1,s:size/0.82,w:0}); x+=a; } y-=size*1.25*0.5+(l.gap||0); } return {items,bottom:y}; }
function linesHeight(lines){ return lines.reduce((a,l)=>a+l.size*1.25+(l.gap||0),0); }

// ---------- instance buffers ----------
let N=0; const scenesBuilt=[];
function swarmHome(i,seed,pos,misc,k){ pos[k*3]=(seed[i*3]-0.5)*1.9*Math.max(1,vw); pos[k*3+1]=(seed[i*3+1]-0.5)*1.3; pos[k*3+2]=-0.12-seed[i*3+2]*0.7; misc[k*4]=Math.floor(seed[i*3+2]*NPOOL); misc[k*4+1]=(0.06+0.05*seed[i*3+1])*AMB; misc[k*4+2]=0.012; misc[k*4+3]=1; }
function itemsToFill(items){ return (pos,misc,seed)=>{ const M=Math.min(items.length,N); for(let k=0;k<M;k++){ const it=items[k]; pos[k*3]=it.x;pos[k*3+1]=it.y;pos[k*3+2]=it.z; misc[k*4]=it.g;misc[k*4+1]=it.b;misc[k*4+2]=it.s;misc[k*4+3]=it.w||0; } for(let k=M;k<N;k++) swarmHome(k,seed,pos,misc,k); }; }
function headFill(fi,fj,m,off,extras){ return (pos,misc,seed)=>{ const zs=ZR[1]-ZR[0], sz=cellW*STRIDE*GS;
  for(let k=0;k<Mh;k++){ const [ix,iy]=headCells[k]; const d=dep(fi,fj,m,ix,iy); if(d<=0){ swarmHome(k,seed,pos,misc,k); continue; }
    const dl=dep(fi,fj,m,ix-st,iy), dr=dep(fi,fj,m,ix+st,iy), dd=dep(fi,fj,m,ix,iy-st), du=dep(fi,fj,m,ix,iy+st);
    const pl=dl>0?1:0,pr=dr>0?1:0,pd=dd>0?1:0,pu=du>0?1:0;
    const gx=((pr?dr:d)-(pl?dl:d))*zs/((pl+pr)*st*cellW+1e-4), gy=((pu?du:d)-(pd?dd:d))*zs/((pd+pu)*st*cellH+1e-4);
    let nx=-gx,ny=-gy,nz=1; const nl=Math.hypot(nx,ny,nz); nx/=nl;ny/=nl;nz/=nl;
    const diff=Math.max(0,nx*L.x+ny*L.y+nz*L.z), rim=Math.pow(1-Math.max(nz,0),1.5);
    let br=0.08+0.75*diff+0.25*rim; const edge=(Math.min(pl,pr,pd,pu)<1?1:0)+((Math.max(Math.abs(dr-dl),Math.abs(du-dd))*zs>0.035)?1:0); br=br+(1-br)*Math.min(1,edge)*0.9; br*=0.55+0.45*d;
    pos[k*3]=B[0]+(ix+0.5)*cellW+off.x; pos[k*3+1]=B[2]+(iy+0.5)*cellH-0.03+off.y; pos[k*3+2]=ZR[0]+d*zs+ZSHIFT;
    misc[k*4]=Math.floor(seed[k*3]*NPOOL); misc[k*4+1]=br; misc[k*4+2]=sz*(0.85+0.3*seed[k*3+1]); misc[k*4+3]=0; }
  const M=Math.min(Mh+extras.length,N); for(let k=Mh;k<M;k++){ const it=extras[k-Mh]; pos[k*3]=it.x;pos[k*3+1]=it.y;pos[k*3+2]=it.z; misc[k*4]=it.g;misc[k*4+1]=it.b;misc[k*4+2]=it.s;misc[k*4+3]=it.w||0; }
  for(let k=M;k<N;k++) swarmHome(k,seed,pos,misc,k); }; }

// ---------- scene builders ----------
const brochureEl=document.getElementById('brochure');
async function buildBrochure(){ const ts=tscale(), ppw=innerHeight/vh;
  // justified block: every text line sized to the name's width
  const nameSize=0.058*ts; const W0=textWidth('JOEL JOHNSON',nameSize);
  const fit=(t,cap)=>Math.min(cap*ts, W0/textWidth(t,1));
  const blocks=[
    {t:'JOEL JOHNSON',size:nameSize,bright:1,gap:0.012},
    {t:'Narrative Strategy & Execution',size:fit('Narrative Strategy & Execution',0.04),bright:0.7,gap:0.04},
    {logos:true,gap:0.04},
    {t:'I translate technical and customer truths into narratives that earn trust.',size:fit('I translate technical and customer truths into narratives that earn trust.',0.03),bright:0.5,gap:0.014},
    {t:"Let's fall in love with your mission again.",size:fit("Let's fall in love with your mission again.",0.03),bright:0.5,gap:0},
  ];
  // logo wall sizes
  const bm=await Promise.all(BRANDS.map(maskFor)); const gapX=0.024*ts, gapY=0.02*ts; const boxW=(W0-4*gapX)/5, boxH=0.046*ts;
  const sizes=bm.map(m=>fitBox(m,boxW,boxH)); const wallH=gridRows(sizes,5,boxW,boxH,gapX,gapY,0).height;
  // vertical stack
  let total=0; for(const b of blocks) total+=(b.logos?wallH:b.size*1.25)+b.gap; let y=total/2;
  brochureEl.innerHTML=''; const items=[];
  let wallDiv=null;
  for(const b of blocks){ if(b.logos){ const d=document.createElement('div'); d.style.height=(wallH*ppw)+'px'; d.style.marginBottom=(b.gap*ppw)+'px'; brochureEl.appendChild(d); wallDiv=d; y-=wallH+b.gap; continue; }
    const d=document.createElement('div'); d.style.fontSize=(b.size*ppw)+'px'; d.style.marginBottom=(b.gap*ppw)+'px'; const g=Math.round(b.bright*255); d.style.color=`rgb(${g},${g},${g})`;
    for(const ch of b.t){ const sp=document.createElement('span'); sp.textContent=ch; d.appendChild(sp); } brochureEl.appendChild(d); y-=b.size*1.25+b.gap; }
  // logo wall flows inside the measured placeholder div
  { const r=wallDiv.getBoundingClientRect(); const top=screenToZ0(innerWidth/2,r.top); const fl=gridRows(sizes,5,boxW,boxH,gapX,gapY,top.y-0.012);
    bm.forEach((m,i)=>{ const c=fl.centers[i], b=BRANDS[i]; if(b.text){ const size=Math.min(0.02*ts, boxW/textWidth(b.text,1)); let x=c.x-textWidth(b.text,size)/2; for(const ch of b.text){ const adv=advance(ch,size); if(ch!==' ') items.push({x:x+adv/2,y:c.y,z:0,g:gidx(ch),b:0.8,s:size/0.82,w:2}); x+=adv; } }
      else items.push(...sampleMask(m,c.x,c.y,boxW,boxH,{target:130,b:0.8,w:2,glyph:1.45}).items); }); }
  // measure the HTML characters
  const ppwi=vh/innerHeight;
  for(const d of brochureEl.children){ if(!d.children.length) continue; const size=parseFloat(d.style.fontSize)*ppwi; const br=parseInt(d.style.color.slice(4))/255; for(const sp of d.children){ if(sp.textContent===' ') continue; const r=sp.getBoundingClientRect(); const wpt=screenToZ0(r.left+r.width/2,r.top+r.height/2); items.push({x:wpt.x,y:wpt.y-size*0.02,z:0,g:gidx(sp.textContent),b:br,s:size/0.82,w:0}); } }
  return items; }
async function buildClaim(sc){ const ts=tscale(); const lines=sc.lines.map(l=>({...l,size:l.size*ts})); const caps=sc.caption.map(t=>({t,size:0.016*ts,bright:0.45}));
  const total=linesHeight(lines)+linesHeight(caps); const a=layoutLines(lines,0,total/2); const c=layoutLines(caps,0,a.bottom); const items=[...a.items,...c.items];
  if(sc.bg){ const m=await loadMask(sc.bg); items.push(...sampleMask(m,0.02,0.02,0.74*ts,0.44*ts,{target:1100,b:0.2,z:-0.3,w:3,glyph:1.5}).items); }
  return items; }
function buildSkills(sc){ const ts=tscale(); const items=[]; const title=layoutLines([{t:sc.title,size:0.017*ts,bright:0.45}],0,0.27*ts); items.push(...title.items);
  const cols=vw>0.8?2:1; const size=0.03*ts; const colW=0.42*ts; const rows=Math.ceil(SKILLS.length/cols); const lh=size*1.7; let y0=(rows-1)*lh/2-0.02;
  SKILLS.forEach((t,i)=>{ const col=i%cols, row=Math.floor(i/cols); const cx=cols===2?(col?colW/2:-colW/2):0; const w=textWidth(t,size); let x=cx-w/2; const y=y0-row*lh; for(const ch of t){ const adv=advance(ch,size); if(ch!==' ') items.push({x:x+adv/2,y,z:0,g:gidx(ch),b:0.85,s:size/0.82,w:0}); x+=adv; } });
  return items; }
async function buildEditorial(sc){ const ts=tscale(); const items=[]; items.push(...layoutLines([{t:sc.title,size:0.017*ts,bright:0.45}],0,0.29*ts).items);
  const pm=await Promise.all(PUBS.map(maskFor)); const boxH=0.04*ts, boxW=0.24*ts; const x0=0.08*ts; let y=0.19*ts; 
  pm.forEach((m,i)=>{ const p=PUBS[i]; const fb=fitBox(m,boxW,boxH); const s=sampleMask(m,x0+fb.w/2,y,boxW,boxH,{target:160,b:0.85,glyph:1.45}); items.push(...s.items); if(p.note){ const ns=0.012*ts; let x=x0+fb.w+0.014*ts; for(const ch of p.note){ const adv=advance(ch,ns); if(ch!==' ') items.push({x:x+adv/2,y,z:0,g:gidx(ch),b:0.4,s:ns/0.82,w:0}); x+=adv; } } y-=Math.max(s.h,0.028*ts)+0.022*ts; });
  return {extras:items, off:{x:-0.24*ts,y:-0.02}}; }
function buildClose(sc){ const ts=tscale(); const a=layoutLines([{t:sc.line,size:0.034*ts,bright:1,gap:0.012},{t:sc.caption,size:0.015*ts,bright:0.5}],0,-0.22*ts); return {extras:a.items, off:{x:0,y:0.1}}; }

async function buildScenes(){ scenesBuilt.length=0; let maxM=0;
  for(const sc of SCENES){ let it;
    if(sc.type==='brochure') it=await buildBrochure();
    else if(sc.type==='claim') it=await buildClaim(sc);
    else if(sc.type==='skills') it=buildSkills(sc);
    else if(sc.type==='editorial'){ const r=await buildEditorial(sc); scenesBuilt.push({head:true,extras:r.extras,off:r.off}); maxM=Math.max(maxM,Mh+r.extras.length); continue; }
    else if(sc.type==='close'){ const r=buildClose(sc); scenesBuilt.push({head:true,extras:r.extras,off:r.off}); maxM=Math.max(maxM,Mh+r.extras.length); continue; }
    scenesBuilt.push({static:itemsToFill(it)}); maxM=Math.max(maxM,it.length); }
  return maxM; }
let maxM=await buildScenes(); N=maxM+Math.max(300,Math.floor(maxM*0.35));

// ---------- geometry / material ----------
const seed=new Float32Array(N*3); let sd=987654321; const rnd=()=>{sd^=sd<<13;sd^=sd>>>17;sd^=sd<<5;return ((sd>>>0)%1000000)/1000000;};
for(let i=0;i<N*3;i++) seed[i]=rnd();
const posA=new Float32Array(N*3),posB=new Float32Array(N*3),miscA=new Float32Array(N*4),miscB=new Float32Array(N*4);
const geo=new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1,1)); geo.instanceCount=N;
const attrPosA=new THREE.InstancedBufferAttribute(posA,3), attrPosB=new THREE.InstancedBufferAttribute(posB,3), attrMiscA=new THREE.InstancedBufferAttribute(miscA,4), attrMiscB=new THREE.InstancedBufferAttribute(miscB,4);
for(const a of [attrPosA,attrPosB,attrMiscA,attrMiscB]) a.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('aPosA',attrPosA); geo.setAttribute('aPosB',attrPosB); geo.setAttribute('aMiscA',attrMiscA); geo.setAttribute('aMiscB',attrMiscB); geo.setAttribute('aSeed',new THREE.InstancedBufferAttribute(seed,3));
const uniforms={uT:{value:0},uTime:{value:0},uAtlas:{value:atlas},uAtlasGrid:{value:G},uFade:{value:0},uDust:{value:0}};
const mat=new THREE.ShaderMaterial({uniforms,vertexShader:`
attribute vec3 aPosA,aPosB,aSeed; attribute vec4 aMiscA,aMiscB;
uniform float uT,uTime,uAtlasGrid,uFade,uDust; varying vec2 vUv; varying float vBright;
float visOf(float w){ return w<0.5?uFade:(w<1.5?uDust:(w<2.5?1.0:uFade)); }
float driftOf(float w){ return w<0.5?0.0:(w<1.5?0.05:(w<2.5?0.0:0.012)); }
void main(){
  float stag=aSeed.z*0.35; float e=smoothstep(0.0,1.0,clamp((uT-stag)/0.65,0.0,1.0));
  vec3 A=aPosA,Bp=aPosB; float moving=step(0.02,distance(A,Bp));
  vec3 dir=normalize(vec3(aSeed.xy-0.5,aSeed.z-0.5)+vec3(1e-4));
  vec3 p=mix(A,Bp,e)+dir*sin(e*3.14159)*(0.18+0.35*aSeed.x)*moving;
  float drift=mix(driftOf(aMiscA.w),driftOf(aMiscB.w),e);
  p+=drift*vec3(sin(uTime*0.7+aSeed.x*60.0),cos(uTime*0.5+aSeed.y*60.0),sin(uTime*0.9+aSeed.z*60.0));
  float g=(e<0.5)?aMiscA.x:aMiscB.x;
  float br=mix(aMiscA.y,aMiscB.y,e); float sz=mix(aMiscA.z,aMiscB.z,e);
  br*=1.0+0.25*sin(e*3.14159)*moving;
  float vis=mix(visOf(aMiscA.w),visOf(aMiscB.w),e);
  vBright=br*vis;
  vec4 mv=modelViewMatrix*vec4(p,1.0); mv.xy+=position.xy*sz; gl_Position=projectionMatrix*mv;
  vec2 cell=vec2(mod(g,uAtlasGrid),floor(g/uAtlasGrid)); vUv=vec2((cell.x+uv.x)/uAtlasGrid,1.0-(cell.y+1.0-uv.y)/uAtlasGrid);
}`,fragmentShader:`
uniform sampler2D uAtlas; varying vec2 vUv; varying float vBright;
void main(){ float a=texture2D(uAtlas,vUv).r; if(a<0.45||vBright<0.004) discard; gl_FragColor=vec4(vec3(min(vBright,1.0)),1.0); }`});
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.getElementById('gl').appendChild(renderer.domElement);
const scene=new THREE.Scene(); const mesh=new THREE.Mesh(geo,mat); mesh.frustumCulled=false; scene.add(mesh);

// ---------- scene pair management ----------
let pair=-1; const headState=SCENES.map(()=>({anim:null,played:false}));
function fillInto(idx,which){ const sb=scenesBuilt[idx]; const pos=which==='A'?posA:posB, misc=which==='A'?miscA:miscB;
  if(sb.head){ const hs=headState[idx]; let fi=REST,fj=REST,m=0; if(hs.anim){ fi=hs.anim.fi;fj=hs.anim.fj;m=hs.anim.m; } headFill(fi,fj,m,sb.off,sb.extras)(pos,misc,seed); }
  else sb.static(pos,misc,seed);
  (which==='A'?attrPosA:attrPosB).needsUpdate=true; (which==='A'?attrMiscA:attrMiscB).needsUpdate=true; }
function setPair(k){ pair=k; fillInto(k,'A'); fillInto(Math.min(S-1,k+1),'B'); }
function tickHead(idx,settled,now,dt){ const hs=headState[idx]; if(!scenesBuilt[idx]||!scenesBuilt[idx].head) return false;
  if(!settled){ if(hs.anim&&hs.anim.phase!=='return'){ hs.anim={phase:'return',fi:hs.anim.fi,fj:REST,m:0,t:0}; } hs.played=false; hs.arm=0; }
  if(settled&&!hs.played&&!hs.anim){ hs.arm=(hs.arm||0)+dt; if(hs.arm>1.4){ hs.anim={phase:'play',t:0,fi:REST,fj:REST,m:0}; hs.arm=0; } }
  if(!hs.anim) return false;
  const a=hs.anim; a.t+=dt;
  if(a.phase==='play'){ const f=GESTURE[0]/STEP+a.t*FPS, i=Math.floor(f), end=toIdx(GESTURE[1]); if(i>=end){ hs.anim={phase:'return',fi:end,fj:REST,m:0,t:0}; } else { a.fi=i;a.fj=Math.min(i+1,end);a.m=f-i; } }
  else if(a.phase==='return'){ const m=Math.min(1,a.t/0.9); a.m=m*m*(3-2*m); if(m>=1){ hs.anim=null; hs.played=true; return true; } }
  return true; }

// ---------- scroll / loop ----------
let ovl=q.get('nofade')?0:1; let pdTarget=+(q.get('pd')||0), pd=pdTarget, last=performance.now()/1000, fadeT=q.get('nofade')?1:0; if(q.get('nofade')) uniforms.uDust.value=1;
addEventListener('scroll',()=>{ pdTarget=THREE.MathUtils.clamp(scrollY/innerHeight,0,S-1); document.getElementById('hint').style.opacity=scrollY>40?0:1; },{passive:true});
let resizeT=null; addEventListener('resize',()=>{ clearTimeout(resizeT); resizeT=setTimeout(async()=>{ renderer.setSize(innerWidth,innerHeight); vh=2*Math.tan(THREE.MathUtils.degToRad(FOV/2))*CAMZ; vw=vh*innerWidth/innerHeight; restCamera(); await buildScenes(); setPair(pair); },150); });
const mouse=new THREE.Vector2(); addEventListener('pointermove',e=>mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)));
let yaw=0;
setPair(Math.min(S-2,Math.floor(pd)));
function loop(){ const now=performance.now()/1000, dt=Math.min(0.05,now-last); last=now; uniforms.uTime.value=now;
  const clean=pdTarget<0.004 && pd<0.004 && !q.get('nofade'); ovl+=((clean?1:0)-ovl)*(1-Math.pow(0.0001,dt)); brochureEl.style.opacity=ovl.toFixed(3);
  fadeT+=((clean?0:1)-fadeT)*(1-Math.pow(0.0001,dt)); uniforms.uFade.value=fadeT;
  uniforms.uDust.value+=((clean?0:1)-uniforms.uDust.value)*(1-Math.pow(0.05,dt));
  pd+=(pdTarget-pd)*(1-Math.pow(0.001,dt));
  let k=Math.min(S-2,Math.floor(pd)); let t=pd-k; if(pd>=S-1){k=S-2;t=1;}
  if(k!==pair) setPair(k);
  uniforms.uT.value=t;
  const chA=tickHead(k,t<0.03,now,dt), chB=tickHead(k+1,t>0.97,now,dt);
  if(chA) fillInto(k,'A'); if(chB) fillInto(k+1,'B');
  const hk=scenesBuilt[k].head?1:0, hk1=scenesBuilt[k+1].head?1:0; const headness=hk*(1-t)+hk1*t;
  yaw+=((Math.sin(now*0.15)*THREE.MathUtils.degToRad(10)*headness+mouse.x*0.08*headness)-yaw)*0.05;
  const tgt=TGT, R=CAMZ-tgt.z;
  camera.position.set(tgt.x+R*Math.sin(yaw)+mouse.x*0.02*headness, tgt.y+mouse.y*0.015*headness, tgt.z+R*Math.cos(yaw)); camera.lookAt(tgt);
  renderer.render(scene,camera);
  if(q.get('dbg')) dbg.textContent=`scene ${k}+${t.toFixed(2)} · N ${N} · head ${Mh}`;
  requestAnimationFrame(loop); }
loop();
</script></body></html>
