<!doctype html>
<html><head><meta charset="utf-8"><title>jj proto</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
#hud{position:fixed;left:14px;bottom:12px;color:#555;font:12px/1.6 ui-monospace,Menlo,monospace;user-select:none}
#hud b{color:#999}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
</head><body>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
const hud=document.getElementById('hud');
const meta=await (await fetch('data/meta.json')).json();
const raw=new Uint16Array(await (await fetch('data/frames.bin')).arrayBuffer());
const rawL=new Uint16Array(await (await fetch('data/lum.bin')).arrayBuffer());
const W=meta.w,H=meta.h,F=meta.frames,STEP=meta.step,FPS=meta.srcFps/STEP;
const toIdx=o=>Math.min(F-1,Math.round(o/STEP));

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.05,20);
const CAMZ=1.25; camera.position.set(0,0,CAMZ);

// ---------- glyph atlas (runtime canvas) ----------
const G=16,CELL=64;
const cv=document.createElement('canvas'); cv.width=cv.height=G*CELL;
const ctx=cv.getContext('2d');
ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#fff'; ctx.font=`600 ${CELL*0.82}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
ctx.textAlign='center'; ctx.textBaseline='middle';
const chars=meta.chars; const NCH=Math.min(chars.length,G*G);
for(let i=0;i<NCH;i++) ctx.fillText(chars[i],(i%G)*CELL+CELL/2,Math.floor(i/G)*CELL+CELL/2+CELL*0.04);
const atlas=new THREE.CanvasTexture(cv); atlas.generateMipmaps=true; atlas.minFilter=THREE.LinearMipmapLinearFilter; atlas.anisotropy=4;

// ---------- depth frame textures (lazy) ----------
const texCache=new Map();
function frameTex(i){
  if(texCache.has(i)) return texCache.get(i);
  const f=new Float32Array(W*H*2); const off=i*W*H;
  for(let k=0;k<W*H;k++){ f[k*2]=raw[off+k]/65535; f[k*2+1]=rawL[off+k]/65535; }
  const t=new THREE.DataTexture(f,W,H,THREE.RGFormat,THREE.FloatType);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true;
  texCache.set(i,t); return t;
}

// ---------- instanced glyph geometry ----------
const q=new URLSearchParams(location.search);
let STRIDE=+(q.get('s')||3), GSCALE=+(q.get('g')||2.4);
function buildGeo(stride){
  const cw=Math.floor(W/stride), ch=Math.floor(H/stride), N=cw*ch;
  const g=new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1,1)); g.instanceCount=N;
  const aCell=new Float32Array(N*2), aGlyph=new Float32Array(N), aSeed=new Float32Array(N*3);
  let s=1234567; const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return ((s>>>0)%100000)/100000;};
  for(let i=0;i<N;i++){ aCell[i*2]=(i%cw)*stride+Math.floor(stride/2); aCell[i*2+1]=Math.floor(i/cw)*stride+Math.floor(stride/2); aGlyph[i]=Math.floor(rnd()*NCH); aSeed[i*3]=rnd();aSeed[i*3+1]=rnd();aSeed[i*3+2]=rnd(); }
  g.setAttribute('aCell',new THREE.InstancedBufferAttribute(aCell,2));
  g.setAttribute('aGlyph',new THREE.InstancedBufferAttribute(aGlyph,1));
  g.setAttribute('aSeed',new THREE.InstancedBufferAttribute(aSeed,3));
  return g;
}
let geo=buildGeo(STRIDE);

const b=meta.bounds, z=meta.zrange;
const cellW=(b[1]-b[0])/W;
const uniforms={
  uDepthA:{value:frameTex(toIdx(meta.rest))}, uDepthB:{value:frameTex(toIdx(meta.rest))}, uMix:{value:0},
  uReveal:{value:0}, uTime:{value:0}, uGrid:{value:new THREE.Vector2(W,H)},
  uBounds:{value:new THREE.Vector4(b[0],b[1],b[2],b[3])}, uZRange:{value:new THREE.Vector2(z[0],z[1])},
  uZShift:{value:0.42}, uSize:{value:cellW*STRIDE*GSCALE}, uAtlas:{value:atlas}, uAtlasGrid:{value:G},
  uMouse:{value:new THREE.Vector3(0,0,0)}, uGlitch:{value:0.0}, uShade:{value:+(q.get('shade')||2)}, uLum:{value:+(q.get('lum')||0)}, uAmbient:{value:+(q.get('amb')??1)}, uSolid:{value:+(q.get('solid')||0)}, uLight:{value:new THREE.Vector3(-0.55,0.5,0.68).normalize()}, uCellW:{value:cellW},
};
const mat=new THREE.ShaderMaterial({uniforms,transparent:false,depthTest:true,
vertexShader:`
uniform sampler2D uDepthA,uDepthB; uniform float uMix,uReveal,uTime,uSize,uZShift,uAtlasGrid,uGlitch,uShade,uCellW,uLum,uAmbient; uniform vec3 uLight;
uniform vec2 uGrid,uZRange; uniform vec4 uBounds; uniform vec3 uMouse;
attribute vec2 aCell; attribute float aGlyph; attribute vec3 aSeed;
varying vec2 vUv; varying float vBright;
float hash(float n){return fract(sin(n)*43758.5453);}
float dep(ivec2 c){ c=clamp(c,ivec2(0),ivec2(uGrid)-1); float a=texelFetch(uDepthA,c,0).r,b=texelFetch(uDepthB,c,0).r; float pa=step(0.0001,a),pb=step(0.0001,b); return (pa*pb>0.5)?mix(a,b,uMix):max(a,b); }
void main(){
  ivec2 c=ivec2(aCell);
  float dA=texelFetch(uDepthA,c,0).r, dB=texelFetch(uDepthB,c,0).r;
  float pA=step(0.0001,dA), pB=step(0.0001,dB);
  float present=mix(pA,pB,uMix);
  float d = (pA*pB>0.5) ? mix(dA,dB,uMix) : max(dA,dB);
  // target on the depth grid
  vec3 target;
  target.x=mix(uBounds.x,uBounds.y,(aCell.x+0.5)/uGrid.x);
  target.y=mix(uBounds.z,uBounds.w,(aCell.y+0.5)/uGrid.y);
  target.z=mix(uZRange.x,uZRange.y,d)+uZShift;
  // living jitter so the rest pose never freezes
  target+=0.0015*vec3(sin(uTime*2.1+aSeed.x*60.0),cos(uTime*1.7+aSeed.y*60.0),sin(uTime*2.9+aSeed.z*60.0));
  // scanline glitch: whole rows slip sideways
  float row=floor(aCell.y/3.0);
  float slip=step(0.985-uGlitch*0.3,hash(row+floor(uTime*8.0)))*(hash(row*7.0+floor(uTime*8.0))-0.5)*0.12;
  target.x+=slip;
  // swarm home: a slow drifting cloud around the figure
  vec3 sw=(aSeed-0.5)*vec3(1.9,1.3,0.9);
  sw+=0.10*vec3(sin(uTime*0.6+aSeed.y*31.0),cos(uTime*0.45+aSeed.z*27.0),sin(uTime*0.7+aSeed.x*23.0));
  sw.z+=0.1;
  // staggered reveal per glyph
  float k=smoothstep(0.0,1.0,clamp((uReveal-aSeed.z*0.6)/0.4,0.0,1.0))*present;
  vec3 p=mix(sw,target,k);
  // cursor repels resolved glyphs a little
  vec2 dm=p.xy-uMouse.xy; float md=length(dm);
  p.xy+=normalize(dm+1e-5)*smoothstep(0.16,0.0,md)*0.05*uMouse.z*k;
  // brightness: nearer = brighter, like a depth preview; unresolved glyphs stay dim
  float nb=mix(0.12,1.0,pow(d,1.25));
  if(uShade>0.5){
    int st=2; float zs=(uZRange.y-uZRange.x);
    float dl=dep(c-ivec2(st,0)), dr=dep(c+ivec2(st,0)), dd=dep(c-ivec2(0,st)), du=dep(c+ivec2(0,st));
    float pl=step(0.0001,dl),pr=step(0.0001,dr),pd=step(0.0001,dd),pu=step(0.0001,du);
    float gx=((pr>0.5?dr:d)-(pl>0.5?dl:d))*zs/((pl+pr)*float(st)*uCellW+1e-4);
    float gy=((pu>0.5?du:d)-(pd>0.5?dd:d))*zs/((pd+pu)*float(st)*uCellW+1e-4);
    vec3 n=normalize(vec3(-gx,-gy,1.0));
    float diff=max(dot(n,uLight),0.0);
    float rim=pow(1.0-max(n.z,0.0),1.5);
    nb=0.08+0.75*diff+0.25*rim;
    if(uShade>1.5){
      float edge=step(0.5,1.0-min(min(pl,pr),min(pd,pu))) + step(0.035,max(abs(dr-dl),abs(du-dd))*zs);
      nb=mix(nb,1.0,clamp(edge,0.0,1.0)*0.9);
    }
    nb*=mix(0.55,1.0,d);
  }
  float lumA=texelFetch(uDepthA,c,0).g, lumB=texelFetch(uDepthB,c,0).g; float lum=mix(lumA,lumB,uMix);
  nb=mix(nb, nb*mix(0.25,1.6,lum), uLum);
  vBright=mix((0.07+0.05*aSeed.y)*uAmbient, nb, k);
  // billboard quad
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  float sz=uSize*mix(0.8,1.15,aSeed.x)*mix(0.7,1.0,k);
  mv.xy+=position.xy*sz;
  gl_Position=projectionMatrix*mv;
  float g=aGlyph; vec2 cell=vec2(mod(g,uAtlasGrid),floor(g/uAtlasGrid));
  vUv=vec2((cell.x+uv.x)/uAtlasGrid, 1.0-(cell.y+1.0-uv.y)/uAtlasGrid);
}`,
fragmentShader:`
uniform sampler2D uAtlas; uniform float uSolid; varying vec2 vUv; varying float vBright;
void main(){ float a=texture2D(uAtlas,vUv).r; if(uSolid>0.5){ vec2 cc=fract(vUv*16.0)-0.5; a=step(length(cc),0.42); } if(a<0.45 || vBright<0.005) discard; gl_FragColor=vec4(vec3(vBright),1.0); }`});
const mesh=new THREE.Mesh(geo,mat); mesh.frustumCulled=false; scene.add(mesh);
function setStride(n){ STRIDE=Math.max(1,Math.min(6,n)); mesh.geometry.dispose(); mesh.geometry=buildGeo(STRIDE); uniforms.uSize.value=cellW*STRIDE*GSCALE; }
function setScale(v){ GSCALE=Math.max(0.6,Math.min(6,v)); uniforms.uSize.value=cellW*STRIDE*GSCALE; }

// ---------- state machine ----------
const REST=toIdx(+(q.get('rest')||meta.rest)); const INTRO=q.get('skipintro')?0.2:4.5;
let state='intro', t0=performance.now()/1000, seg=null, segT=0, idleUntil=0, mixFrom=REST;
function playGesture(){ if(state!=='idle') return; console.log('gesture start',performance.now()/1000); seg=meta.segments[Math.floor(Math.random()*meta.segments.length)]; segT=0; state='gesture'; }
function scheduleIdle(now){ idleUntil=now+(q.get('auto')==='now'?0.3:8+Math.random()*7); }
const mouse=new THREE.Vector2(0,0); let mouseOn=0;
const YAWMAX=THREE.MathUtils.degToRad(+(q.get('yawmax')||40)), PITCHMAX=THREE.MathUtils.degToRad(18);
let yaw=THREE.MathUtils.degToRad(+(q.get('yaw')||0)), pitch=THREE.MathUtils.degToRad(+(q.get('pitch')||0)), tYaw=yaw, tPitch=pitch;
let dragging=false, dragMoved=0, lastX=0, lastY=0, lastInput=0;
addEventListener('pointerdown',e=>{ dragging=true; dragMoved=0; lastX=e.clientX; lastY=e.clientY; });
addEventListener('pointerup',()=>{ dragging=false; });
addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; dragMoved+=Math.abs(dx)+Math.abs(dy);
  tYaw=THREE.MathUtils.clamp(tYaw-dx*0.005,-YAWMAX,YAWMAX); tPitch=THREE.MathUtils.clamp(tPitch+dy*0.004,-PITCHMAX,PITCHMAX); lastInput=performance.now()/1000; });
addEventListener('pointermove',e=>{ mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); mouseOn=1; });
addEventListener('pointerleave',()=>mouseOn=0);
addEventListener('click',()=>{ if(dragMoved<6 && state==='idle') playGesture(); });
addEventListener('keydown',e=>{ if(e.key===' ') playGesture(); if(e.key==='r'){state='intro';t0=performance.now()/1000;} if(e.key==='g'){uniforms.uGlitch.value=uniforms.uGlitch.value>0?0:1;} if(e.key==='l'){uniforms.uShade.value=(uniforms.uShade.value+1)%3;} if(e.key==='v'){const L=[0,0.35,0.7,1.0]; uniforms.uLum.value=L[(L.indexOf(uniforms.uLum.value)+1)%L.length];} if(e.key==='d'){uniforms.uSolid.value=uniforms.uSolid.value?0:1;} if(e.key==='a'){const A=[1,0.5,0.2,0]; uniforms.uAmbient.value=A[(A.indexOf(uniforms.uAmbient.value)+1)%A.length];} if(e.key>='1'&&e.key<='6') setStride(+e.key); if(e.key==='='||e.key==='+') setScale(GSCALE*1.15); if(e.key==='-') setScale(GSCALE/1.15); });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

let last=performance.now()/1000;
function setFrames(a,bb,m){ uniforms.uDepthA.value=frameTex(a); uniforms.uDepthB.value=frameTex(bb); uniforms.uMix.value=m; }
function loop(){
  const now=performance.now()/1000, dt=Math.min(0.05,now-last); last=now;
  uniforms.uTime.value=now;
  if(state==='intro'){
    const u=(now-t0)/INTRO; uniforms.uReveal.value=Math.min(1,u); setFrames(REST,REST,0);
    if(u>=1){ state='idle'; scheduleIdle(now); console.log('intro done',now,'idleUntil',idleUntil); }
  } else if(state==='idle'){
    uniforms.uReveal.value=1; setFrames(REST,REST,0);
    if(now>idleUntil && !q.get('nogesture')) playGesture();
  } else if(state==='gesture'){
    segT+=dt; const f=seg[0]/STEP+segT*FPS; const i=Math.floor(f);
    const end=toIdx(seg[1]);
    if(i>=end){ state='return'; segT=0; mixFrom=end; console.log('gesture end',now); }
    else setFrames(i,Math.min(i+1,end),f-i);
  } else if(state==='return'){
    segT+=dt; const m=Math.min(1,segT/0.9); setFrames(mixFrom,REST,m*m*(3-2*m));
    if(m>=1){ state='idle'; scheduleIdle(now); }
  }
  // parallax camera + cursor in world units at the figure plane
  const drift=(now-lastInput>4)?Math.sin(now*0.15)*THREE.MathUtils.degToRad(12):0;
  yaw+=((tYaw+drift)-yaw)*0.05; pitch+=(tPitch-pitch)*0.05;
  const tgt=new THREE.Vector3(0,-0.04,0.05), R=CAMZ-tgt.z;
  camera.position.set(tgt.x+R*Math.sin(yaw)*Math.cos(pitch)+mouse.x*0.06, tgt.y+R*Math.sin(pitch)+mouse.y*0.04, tgt.z+R*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(tgt);
  const halfH=Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*(CAMZ-0.05);
  uniforms.uMouse.value.set(mouse.x*halfH*camera.aspect, mouse.y*halfH, mouseOn);
  renderer.render(scene,camera);
  hud.innerHTML=`<b>${state}</b> · drag: orbit (yaw ${THREE.MathUtils.radToDeg(yaw).toFixed(0)}°) · space/click: gesture · r: replay intro · g: glitch ${uniforms.uGlitch.value?'on':'off'} · l: shading (${['nearness','lit','lit+edges'][uniforms.uShade.value]}) · v: tone blend (${uniforms.uLum.value}) · d: dots/glyphs · a: ambient swarm (${uniforms.uAmbient.value}) · 1-6: density (stride ${STRIDE}, ${mesh.geometry.instanceCount} cells) · +/-: glyph size (${GSCALE.toFixed(2)})`;
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
