<!doctype html>
<html><head><meta charset="utf-8"><title>Joel Johnson · Narrative Strategy</title>
<style>
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:block;src:url(fonts/inter-600.woff2) format('woff2')}
html{scroll-snap-type:y proximity}
html,body{margin:0;background:#000;color:#777}

.sec{height:100vh;scroll-snap-align:start;position:relative;z-index:1;pointer-events:none}

#dbg{position:fixed;left:12px;bottom:10px;color:#333;font:11px ui-monospace,Menlo,monospace;z-index:2}
#brochure{font-variant-ligatures:none;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;pointer-events:none;font-weight:600;white-space:pre;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
#brochure div{line-height:1.25}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
</head><body>
<div id="gl"></div>
<div id="brochure"></div>
<div id="hint">scroll</div>
<div id="dbg"></div>
<div id="sections"></div>
<script type="module">
import * as THREE from 'three';
await document.fonts.load('600 64px Inter'); await document.fonts.ready;
const q=new URLSearchParams(location.search);
const meta=await (await fetch('data/meta.json')).json();
const raw=new Uint16Array(await (await fetch('data/frames.bin')).arrayBuffer());
const W=meta.w,H=meta.h,F=meta.frames,STEP=meta.step,FPS=meta.srcFps/STEP;
const toIdx=o=>Math.min(F-1,Math.round(o/STEP));
const B=meta.bounds, ZR=meta.zrange, cellW=(B[1]-B[0])/W, cellH=(B[3]-B[2])/H;
const STRIDE=+(q.get('s')||3), GS=+(q.get('g')||2.4), AMB=+(q.get('amb')??0.3), ZSHIFT=0.42;
const REST=toIdx(meta.rest), GESTURE=meta.segments[0];
const CAMZ=1.25, FOV=30;
const dbg=document.getElementById('dbg');

// ---------- content ----------
const SUMMARY="I help complex organizations fall in love with their mission again by finding the signal in the noise. I've led editorial networks reaching tens of millions, built the evidence-led formats for Wirecutter, and directed communications for Twitch and General Motors. I know how to translate technical truths into narratives that earn trust.";
function wrap(text,maxChars){ const out=[]; let line=''; for(const w of text.split(' ')){ if((line+' '+w).trim().length>maxChars){ out.push(line.trim()); line=w; } else line=(line+' '+w); } if(line.trim()) out.push(line.trim()); return out; }
const SCENES=[
 {type:'text', lines:[
   {t:'JOEL JOHNSON',size:0.075,bright:1.0,gap:0.03},
   {t:'Narrative Strategy',size:0.03,bright:0.7,gap:0.055},
   {t:'Community & editorial leader',size:0.022,bright:0.55,gap:0.0},
   {t:'Former technology journalist',size:0.022,bright:0.55,gap:0.0},
   {t:'AI workflow builder',size:0.022,bright:0.55,gap:0.05},
   ...wrap(SUMMARY,62).map(s=>({t:s,size:0.016,bright:0.42,gap:0.0})),
   {t:'',size:0.016,bright:0,gap:0.03},
   {t:'Johnson & Roy · New York',size:0.016,bright:0.5,gap:0},
 ]},
 {type:'head'},
 {type:'text', lines:[{t:'Zero Crashes,',size:0.06,bright:1,gap:0},{t:'Zero Emissions,',size:0.06,bright:1,gap:0},{t:'Zero Congestion.',size:0.06,bright:1,gap:0.05},
   {t:'General Motors · corporate vision framework,',size:0.017,bright:0.45,gap:0},{t:'adopted as the primary investor narrative',size:0.017,bright:0.45,gap:0}]},
 {type:'head'},
 {type:'text', lines:[{t:'2M views',size:0.075,bright:1,gap:0},{t:'in 48 hours.',size:0.075,bright:1,gap:0.05},
   {t:'IBM · earned-social campaign translating',size:0.017,bright:0.45,gap:0},{t:'mainframe heritage for cloud developers',size:0.017,bright:0.45,gap:0}]},
 {type:'head'},
 {type:'text', lines:[{t:'Co-founded',size:0.07,bright:1,gap:0},{t:'Wirecutter.',size:0.07,bright:1,gap:0.05},
   {t:'Evidence-led review formats',size:0.017,bright:0.45,gap:0},{t:'still in use at The New York Times',size:0.017,bright:0.45,gap:0}]},
 {type:'marks', title:'Selected clients & bylines', names:['IBM','Twitch','General Motors','WIRED','Wirecutter','Gizmodo','Popular Mechanics','Gawker Media']},
 {type:'text', lines:[{t:"Let's find the signal.",size:0.055,bright:1,gap:0.05},{t:'joeljohnson@gmail.com · New York',size:0.018,bright:0.5,gap:0}]},
];
const S=SCENES.length;
document.getElementById('sections').innerHTML=SCENES.map(()=>'<div class="sec"></div>').join('');

// ---------- glyph atlas ----------
const G=16,CELL=64, FONTFAM='Inter,"Helvetica Neue",Helvetica,Arial,sans-serif';
const POOL='JOELJOHNSONABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789&?!@#%*+-/=<>{}[]();:.,';
let chars=''; const seen=new Set();
for(const ch of (POOL+SCENES.flatMap(s=>s.lines?s.lines.map(l=>l.t):(s.names||[]).concat(s.title||'')).join('')+'abcdefghijklmnopqrstuvwxyz\'’')) if(ch!==' '&&!seen.has(ch)){seen.add(ch);chars+=ch;}
chars=chars.slice(0,G*G); const gidx=ch=>{const i=chars.indexOf(ch);return i<0?0:i;};
const cv=document.createElement('canvas'); cv.width=cv.height=G*CELL; const ctx=cv.getContext('2d');
ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle='#fff';
ctx.font=`600 ${CELL*0.82}px ${FONTFAM}`; ctx.textAlign='center'; ctx.textBaseline='middle';
for(let i=0;i<chars.length;i++) ctx.fillText(chars[i],(i%G)*CELL+CELL/2,Math.floor(i/G)*CELL+CELL/2+CELL*0.04);
const atlas=new THREE.CanvasTexture(cv); atlas.generateMipmaps=true; atlas.minFilter=THREE.LinearMipmapLinearFilter; atlas.anisotropy=4;
const meas=document.createElement('canvas').getContext('2d');
function advance(ch,size){ meas.font=`600 100px ${FONTFAM}`; return meas.measureText(ch).width/100*size; }

// ---------- world/viewport ----------
let vh=2*Math.tan(THREE.MathUtils.degToRad(FOV/2))*CAMZ, vw=vh*innerWidth/innerHeight;
const TGT=new THREE.Vector3(0,-0.02,0.05);
const camera=new THREE.PerspectiveCamera(FOV,innerWidth/innerHeight,0.05,20);
function restCamera(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); camera.position.set(TGT.x,TGT.y,TGT.z+(CAMZ-TGT.z)); camera.lookAt(TGT); camera.updateMatrixWorld(); }
restCamera();
function screenToZ0(cx,cy){ const nd=new THREE.Vector3(cx/innerWidth*2-1,-(cy/innerHeight*2-1),0.5).unproject(camera); const dir=nd.sub(camera.position).normalize(); const t=-camera.position.z/dir.z; return camera.position.clone().add(dir.multiplyScalar(t)); }
const tscale=()=>THREE.MathUtils.clamp(vw/1.05,0.55,1);

// ---------- head cells (union over rest + gesture frames) ----------
const st=STRIDE, cw=Math.floor(W/st), chh=Math.floor(H/st);
const used=[REST]; for(let o=GESTURE[0];o<=GESTURE[1];o+=STEP*4) used.push(toIdx(o));
const headCells=[];
for(let j=0;j<chh;j++)for(let i=0;i<cw;i++){ const ix=i*st+Math.floor(st/2), iy=j*st+Math.floor(st/2); let any=false; for(const f of used){ if(raw[f*W*H+iy*W+ix]>0){any=true;break;} } if(any) headCells.push([ix,iy]); }
const Mh=headCells.length;
const L=new THREE.Vector3(-0.55,0.5,0.68).normalize();
function dep(fi,fj,m,ix,iy){ if(ix<0||iy<0||ix>=W||iy>=H) return 0; const a=raw[fi*W*H+iy*W+ix]/65535, b=raw[fj*W*H+iy*W+ix]/65535; if(a>0&&b>0) return a+(b-a)*m; return Math.max(a,b); }

// ---------- instance buffers ----------
let N=0; const scenesBuilt=[]; // each: {fill(pos,misc)} static, or head dynamic
function swarmHome(i,seed,pos,misc,k){ pos[k*3]=(seed[i*3]-0.5)*1.9*Math.max(1,vw/1.0); pos[k*3+1]=(seed[i*3+1]-0.5)*1.3; pos[k*3+2]=-0.12-seed[i*3+2]*0.7; misc[k*4]=Math.floor(seed[i*3+2]*36); misc[k*4+1]=(0.06+0.05*seed[i*3+1])*AMB; misc[k*4+2]=0.012; misc[k*4+3]=1; }
function layoutText(lines){ const ts=tscale(); const items=[]; let total=0; for(const l of lines) total+=l.size*ts*1.25+l.gap*ts; let y=total/2; 
  for(const l of lines){ const size=l.size*ts; y-=size*1.25*0.5; let wsum=0; for(const ch of l.t) wsum+=advance(ch,size); let x=-wsum/2; for(const ch of l.t){ const a=advance(ch,size); if(ch!==' ') items.push({x:x+a/2,y,z:0,g:gidx(ch),b:l.bright,s:size/0.82}); x+=a; } y-=size*1.25*0.5+l.gap*ts; }
  return items; }
function sampleMarks(names,title){ const ts=tscale(); const items=[]; const em=0.052*ts, gapx=0.07*ts, gapy=0.04*ts, maxw=vw*0.86;
  // measure, flow into rows
  const widths=names.map(n=>{ let w=0; for(const ch of n) w+=advance(ch,em)*1.02; return w; });
  const rows=[[]]; let rw=0; names.forEach((n,i)=>{ const w=widths[i]; if(rw+w>maxw&&rows[rows.length-1].length){ rows.push([]); rw=0; } rows[rows.length-1].push(i); rw+=w+gapx; });
  const rowH=em*1.15+gapy; let y=(rows.length-1)*rowH/2 - 0.03;
  // sample pixels of each name from an offscreen render
  const oc=document.createElement('canvas'); const octx=oc.getContext('2d');
  for(const row of rows){ const tw=row.reduce((a,i)=>a+widths[i],0)+gapx*(row.length-1); let x=-tw/2;
    for(const i of row){ const n=names[i], w=widths[i]; const px=160, scale=em/px; oc.width=Math.ceil(w/scale)+40; oc.height=px*1.4; octx.fillStyle='#000'; octx.fillRect(0,0,oc.width,oc.height); octx.fillStyle='#fff'; octx.font=`700 ${px}px ${FONTFAM}`; octx.textBaseline='middle'; octx.fillText(n,20,oc.height/2);
      const d=octx.getImageData(0,0,oc.width,oc.height).data; const step=+(q.get('mstep')||8);
      for(let yy=0;yy<oc.height;yy+=step)for(let xx=0;xx<oc.width;xx+=step){ const jx=xx+(Math.random()-0.5)*step*0.8, jy=yy+(Math.random()-0.5)*step*0.8; const sx=Math.round(Math.min(oc.width-1,Math.max(0,jx))), sy=Math.round(Math.min(oc.height-1,Math.max(0,jy))); if(d[(sy*oc.width+sx)*4]>128){ items.push({x:x+(jx-20)*scale,y:y-(jy-oc.height/2)*scale,z:(Math.random()-0.5)*0.01,g:Math.floor(Math.random()*36),b:0.7+Math.random()*0.3,s:step*scale*1.7}); } }
      x+=w+gapx; }
    y-=rowH; }
  if(title){ const ts2=tscale(); const size=0.017*ts2; let wsum=0; for(const ch of title) wsum+=advance(ch,size); let x=-wsum/2; const ty=Math.min(vh*0.42,(rows.length-1)*rowH/2+em*0.5+0.03); for(const ch of title){ const a=advance(ch,size); if(ch!==' ') items.push({x:x+a/2,y:ty,z:0,g:gidx(ch),b:0.45,s:size/0.82}); x+=a; } }
  return items; }
const brochureEl=document.getElementById('brochure');
function buildBrochure(lines){ const ts=tscale(), ppw=innerHeight/vh; brochureEl.innerHTML='';
  for(const l of lines){ const d=document.createElement('div'); d.style.fontSize=(l.size*ts*ppw)+'px'; d.style.marginBottom=(l.gap*ts*ppw)+'px'; d.style.color=`rgb(${Math.round(l.bright*255)},${Math.round(l.bright*255)},${Math.round(l.bright*255)})`; d.style.fontSize=(l.size*ts*ppw)+'px';
    for(const ch of l.t){ const sp=document.createElement('span'); sp.textContent=ch; d.appendChild(sp); } if(!l.t) d.innerHTML='&nbsp;'; brochureEl.appendChild(d); }
  // measure
  const items=[]; const ppwi=vh/innerHeight;
  for(const d of brochureEl.children){ const size=parseFloat(d.style.fontSize)*ppwi; const br=parseInt(d.style.color.slice(4))/255; for(const sp of d.children){ if(sp.textContent===' ') continue; const r=sp.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const wpt=screenToZ0(cx,cy); items.push({x:wpt.x, y:wpt.y - size*0.02, z:0, g:gidx(sp.textContent), b:br, s:size/0.82}); } }
  return items; }
function itemsToFill(items){ return (pos,misc,seed)=>{ const M=Math.min(items.length,N); for(let k=0;k<M;k++){ const it=items[k]; pos[k*3]=it.x;pos[k*3+1]=it.y;pos[k*3+2]=it.z; misc[k*4]=it.g;misc[k*4+1]=it.b;misc[k*4+2]=it.s;misc[k*4+3]=0; } for(let k=M;k<N;k++) swarmHome(k,seed,pos,misc,k); }; }
function headFill(fi,fj,m){ return (pos,misc,seed)=>{ const zs=ZR[1]-ZR[0], sz=cellW*STRIDE*GS; 
  for(let k=0;k<Mh;k++){ const [ix,iy]=headCells[k]; const d=dep(fi,fj,m,ix,iy); if(d<=0){ swarmHome(k,seed,pos,misc,k); continue; }
    const dl=dep(fi,fj,m,ix-st,iy), dr=dep(fi,fj,m,ix+st,iy), dd=dep(fi,fj,m,ix,iy-st), du=dep(fi,fj,m,ix,iy+st);
    const pl=dl>0?1:0,pr=dr>0?1:0,pd=dd>0?1:0,pu=du>0?1:0;
    const gx=((pr?dr:d)-(pl?dl:d))*zs/((pl+pr)*st*cellW+1e-4), gy=((pu?du:d)-(pd?dd:d))*zs/((pd+pu)*st*cellH+1e-4);
    let nx=-gx,ny=-gy,nz=1; const nl=Math.hypot(nx,ny,nz); nx/=nl;ny/=nl;nz/=nl;
    const diff=Math.max(0,nx*L.x+ny*L.y+nz*L.z), rim=Math.pow(1-Math.max(nz,0),1.5);
    let br=0.08+0.75*diff+0.25*rim; const edge=(Math.min(pl,pr,pd,pu)<1?1:0)+((Math.max(Math.abs(dr-dl),Math.abs(du-dd))*zs>0.035)?1:0); br=br+(1-br)*Math.min(1,edge)*0.9; br*=0.55+0.45*d;
    pos[k*3]=B[0]+(ix+0.5)*cellW; pos[k*3+1]=B[2]+(iy+0.5)*cellH-0.03; pos[k*3+2]=ZR[0]+d*zs+ZSHIFT;
    misc[k*4]=Math.floor(seed[k*3]*36); misc[k*4+1]=br; misc[k*4+2]=sz*(0.85+0.3*seed[k*3+1]); misc[k*4+3]=0; }
  for(let k=Mh;k<N;k++) swarmHome(k,seed,pos,misc,k); }; }

function buildScenes(){ scenesBuilt.length=0; let maxM=Mh;
  SCENES.forEach((sc,si)=>{ if(sc.type==='text'){ const it=si===0?buildBrochure(sc.lines):layoutText(sc.lines); maxM=Math.max(maxM,it.length); scenesBuilt.push({static:itemsToFill(it),M:it.length}); }
    else if(sc.type==='marks'){ const it=sampleMarks(sc.names,sc.title); maxM=Math.max(maxM,it.length); scenesBuilt.push({static:itemsToFill(it),M:it.length}); }
    else scenesBuilt.push({head:true,M:Mh}); });
  return maxM; }
let maxM=buildScenes(); N=maxM+Math.max(300,Math.floor(maxM*0.4));

// ---------- geometry / material ----------
const seed=new Float32Array(N*3); let sd=987654321; const rnd=()=>{sd^=sd<<13;sd^=sd>>>17;sd^=sd<<5;return ((sd>>>0)%1000000)/1000000;};
for(let i=0;i<N*3;i++) seed[i]=rnd();
const posA=new Float32Array(N*3),posB=new Float32Array(N*3),miscA=new Float32Array(N*4),miscB=new Float32Array(N*4);
const geo=new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1,1)); geo.instanceCount=N;
const attrPosA=new THREE.InstancedBufferAttribute(posA,3), attrPosB=new THREE.InstancedBufferAttribute(posB,3), attrMiscA=new THREE.InstancedBufferAttribute(miscA,4), attrMiscB=new THREE.InstancedBufferAttribute(miscB,4);
for(const a of [attrPosA,attrPosB,attrMiscA,attrMiscB]) a.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('aPosA',attrPosA); geo.setAttribute('aPosB',attrPosB); geo.setAttribute('aMiscA',attrMiscA); geo.setAttribute('aMiscB',attrMiscB); geo.setAttribute('aSeed',new THREE.InstancedBufferAttribute(seed,3));
const uniforms={uT:{value:0},uTime:{value:0},uAtlas:{value:atlas},uAtlasGrid:{value:G},uFade:{value:0},uDust:{value:0}};
const mat=new THREE.ShaderMaterial({uniforms,vertexShader:`
attribute vec3 aPosA,aPosB,aSeed; attribute vec4 aMiscA,aMiscB;
uniform float uT,uTime,uAtlasGrid,uFade,uDust; varying vec2 vUv; varying float vBright;
void main(){
  float stag=aSeed.z*0.35; float e=smoothstep(0.0,1.0,clamp((uT-stag)/0.65,0.0,1.0));
  vec3 A=aPosA,Bp=aPosB; float moving=step(0.02,distance(A,Bp));
  vec3 dir=normalize(vec3(aSeed.xy-0.5,aSeed.z-0.5)+vec3(1e-4));
  vec3 p=mix(A,Bp,e)+dir*sin(e*3.14159)*(0.18+0.35*aSeed.x)*moving;
  float dust=mix(aMiscA.w,aMiscB.w,e);
  p+=mix(0.0,0.05,dust)*vec3(sin(uTime*0.7+aSeed.x*60.0),cos(uTime*0.5+aSeed.y*60.0),sin(uTime*0.9+aSeed.z*60.0));
  float g=(e<0.5)?aMiscA.x:aMiscB.x;
  float br=mix(aMiscA.y,aMiscB.y,e); float sz=mix(aMiscA.z,aMiscB.z,e);
  // in flight: letters flare a little
  br*=1.0+0.25*sin(e*3.14159)*moving;
  vBright=br*uFade*mix(1.0,uDust,dust);
  vec4 mv=modelViewMatrix*vec4(p,1.0); mv.xy+=position.xy*sz; gl_Position=projectionMatrix*mv;
  vec2 cell=vec2(mod(g,uAtlasGrid),floor(g/uAtlasGrid)); vUv=vec2((cell.x+uv.x)/uAtlasGrid,1.0-(cell.y+1.0-uv.y)/uAtlasGrid);
}`,fragmentShader:`
uniform sampler2D uAtlas; varying vec2 vUv; varying float vBright;
void main(){ float a=texture2D(uAtlas,vUv).r; if(a<0.45||vBright<0.004) discard; gl_FragColor=vec4(vec3(min(vBright,1.0)),1.0); }`});
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.getElementById('gl').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const mesh=new THREE.Mesh(geo,mat); mesh.frustumCulled=false; scene.add(mesh);

// ---------- scene pair management ----------
let pair=-1; const headState=SCENES.map(()=>({anim:null,played:false}));
function fillInto(idx,which){ const sb=scenesBuilt[idx]; const pos=which==='A'?posA:posB, misc=which==='A'?miscA:miscB;
  if(sb.head){ const hs=headState[idx]; let fi=REST,fj=REST,m=0; if(hs.anim){ fi=hs.anim.fi;fj=hs.anim.fj;m=hs.anim.m; } headFill(fi,fj,m)(pos,misc,seed); }
  else sb.static(pos,misc,seed);
  (which==='A'?attrPosA:attrPosB).needsUpdate=true; (which==='A'?attrMiscA:attrMiscB).needsUpdate=true; }
function setPair(k){ pair=k; fillInto(k,'A'); fillInto(Math.min(S-1,k+1),'B'); }

// ---------- gesture on head scenes ----------
function tickHead(idx,settled,now,dt){ const hs=headState[idx]; if(!SCENES[idx]||SCENES[idx].type!=='head') return false;
  if(!settled){ if(hs.anim&&hs.anim.phase!=='return'){ hs.anim={phase:'return',fi:hs.anim.fi,fj:REST,m:0,t:0}; } hs.played=hs.played&&settled; }
  if(settled&&!hs.played&&!hs.anim){ hs.arm=(hs.arm||0)+dt; if(hs.arm>1.4){ hs.anim={phase:'play',t:0,fi:REST,fj:REST,m:0}; hs.arm=0; } }
  if(!settled) hs.arm=0;
  if(!hs.anim) return false;
  const a=hs.anim; a.t+=dt;
  if(a.phase==='play'){ const f=GESTURE[0]/STEP+a.t*FPS, i=Math.floor(f), end=toIdx(GESTURE[1]); if(i>=end){ hs.anim={phase:'return',fi:end,fj:REST,m:0,t:0}; } else { a.fi=i;a.fj=Math.min(i+1,end);a.m=f-i; } }
  else if(a.phase==='return'){ const m=Math.min(1,a.t/0.9); a.m=m*m*(3-2*m); if(m>=1){ hs.anim=null; hs.played=true; return true; } }
  return true; }

// ---------- scroll ----------
let ovl=q.get('nofade')?0:1; let pdTarget=+(q.get('pd')||0), pd=pdTarget, last=performance.now()/1000, fadeT=q.get('nofade')?1:0; if(q.get('nofade')) uniforms.uDust.value=1;
addEventListener('scroll',()=>{ pdTarget=THREE.MathUtils.clamp(scrollY/innerHeight,0,S-1); document.getElementById('hint').style.opacity=scrollY>40?0:1; },{passive:true});
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); vh=2*Math.tan(THREE.MathUtils.degToRad(FOV/2))*CAMZ; vw=vh*innerWidth/innerHeight; restCamera(); buildScenes(); setPair(pair); });
const mouse=new THREE.Vector2(); addEventListener('pointermove',e=>mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)));
let yaw=0;
setPair(Math.min(S-2,Math.floor(pd)));
function loop(){ const now=performance.now()/1000, dt=Math.min(0.05,now-last); last=now; uniforms.uTime.value=now;
  const clean=pdTarget<0.004 && pd<0.004 && !q.get('nofade'); ovl+=((clean?1:0)-ovl)*(1-Math.pow(0.0001,dt)); brochureEl.style.opacity=ovl.toFixed(3);
  fadeT+=((clean?0:1)-fadeT)*(1-Math.pow(0.0001,dt)); uniforms.uFade.value=fadeT;
  uniforms.uDust.value+=((clean?0:1)-uniforms.uDust.value)*(1-Math.pow(0.05,dt));
  pd+=(pdTarget-pd)*(1-Math.pow(0.001,dt)); // smooth follow
  let k=Math.min(S-2,Math.floor(pd)); let t=pd-k; if(pd>=S-1){k=S-2;t=1;}
  if(k!==pair) setPair(k);
  uniforms.uT.value=t;
  // head animation on whichever of the pair is settled
  const chA=tickHead(k,t<0.03,now,dt), chB=tickHead(k+1,t>0.97,now,dt);
  if(chA) fillInto(k,'A'); if(chB) fillInto(k+1,'B');
  // camera: slow drift only while a head is on screen
  const headness=(SCENES[k].type==='head'?1-t:0)+(SCENES[k+1].type==='head'?t:0);
  yaw+=((Math.sin(now*0.15)*THREE.MathUtils.degToRad(10)*headness+mouse.x*0.08*headness)-yaw)*0.05;
  const tgt=TGT, R=CAMZ-tgt.z;
  camera.position.set(tgt.x+R*Math.sin(yaw)+mouse.x*0.02*headness, tgt.y+mouse.y*0.015*headness, tgt.z+R*Math.cos(yaw)); camera.lookAt(tgt);
  renderer.render(scene,camera);
  if(q.get('dbg')) dbg.textContent=`scene ${k}+${t.toFixed(2)} · N ${N} · head ${Mh} · pair ${pair}`;
  requestAnimationFrame(loop); }
loop();
</script></body></html>
